[pytest]
# Pytest configuration for AI Ambassador Platform

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts =
    # Verbose output
    -v
    # Show extra test summary info
    -ra
    # Show local variables in tracebacks
    --tb=short
    # Enable coverage reporting
    --cov=.
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
    # Exclude paths from coverage
    --cov-config=.coveragerc
    # Show warnings
    -W default
    # Strict markers
    --strict-markers
    # Capture output
    --capture=no

# Test markers
markers =
    unit: Unit tests for individual functions/methods
    integration: Integration tests for component interactions
    e2e: End-to-end tests for complete workflows
    slow: Tests that take a long time to run
    azure: Tests that interact with Azure services (require credentials)
    demo: Tests related to demo functionality

# Coverage exclusions
[coverage:run]
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */venv/*
    */.venv/*

# Minimum coverage threshold
[coverage:report]
precision = 2
skip_empty = True
fail_under = 80

# HTML coverage report output
[coverage:html]
directory = htmlcov
