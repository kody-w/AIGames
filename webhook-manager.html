<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webhook Manager - AI Ambassador Platform</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            margin-bottom: 30px;
        }

        h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 2em;
        }

        .subtitle {
            color: #666;
            font-size: 1.1em;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-label {
            font-size: 0.9em;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .stat-value {
            font-size: 2.5em;
            font-weight: bold;
            color: #667eea;
        }

        .stat-unit {
            font-size: 0.5em;
            color: #999;
            margin-left: 5px;
        }

        .main-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }

        .section-title {
            font-size: 1.5em;
            color: #333;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        .btn-sm {
            padding: 8px 20px;
            font-size: 0.9em;
        }

        .btn-danger {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .btn-success {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }

        .webhook-list {
            margin-top: 20px;
        }

        .webhook-item {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
            transition: all 0.3s;
        }

        .webhook-item:hover {
            background: #e9ecef;
            transform: translateX(5px);
        }

        .webhook-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }

        .webhook-url {
            font-size: 1.1em;
            color: #333;
            font-weight: 600;
            word-break: break-all;
        }

        .webhook-meta {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }

        .meta-item {
            font-size: 0.9em;
            color: #666;
        }

        .meta-label {
            font-weight: 600;
            color: #333;
            margin-right: 5px;
        }

        .webhook-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 0.85em;
            font-weight: 600;
            margin: 3px;
        }

        .badge-active {
            background: #d4edda;
            color: #155724;
        }

        .badge-inactive {
            background: #f8d7da;
            color: #721c24;
        }

        .badge-event {
            background: #d1ecf1;
            color: #0c5460;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 20px;
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .modal-header {
            font-size: 1.8em;
            margin-bottom: 25px;
            color: #667eea;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        .form-input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        .form-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .checkbox-group {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
        }

        .checkbox-item input {
            margin-right: 8px;
        }

        .form-actions {
            display: flex;
            gap: 15px;
            justify-content: flex-end;
            margin-top: 30px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
            font-size: 1.2em;
        }

        .loading::after {
            content: '...';
            animation: dots 1.5s infinite;
        }

        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }

        .delivery-log {
            margin-top: 20px;
        }

        .delivery-item {
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 4px solid #ccc;
        }

        .delivery-item.success {
            border-left-color: #28a745;
        }

        .delivery-item.failed {
            border-left-color: #dc3545;
        }

        .delivery-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .delivery-time {
            color: #666;
            font-size: 0.9em;
        }

        .delivery-details {
            font-size: 0.9em;
            color: #555;
        }

        .code-block {
            background: #f4f4f4;
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
            font-family: 'Courier New', monospace;
            font-size: 0.85em;
            margin-top: 10px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state-icon {
            font-size: 4em;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Webhook Manager</h1>
            <p class="subtitle">Manage webhooks and monitor real-time event deliveries</p>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Active Webhooks</div>
                <div class="stat-value" id="stat-active">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Events Sent (24h)</div>
                <div class="stat-value" id="stat-events">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Success Rate</div>
                <div class="stat-value" id="stat-success">0<span class="stat-unit">%</span></div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Failed Deliveries</div>
                <div class="stat-value" id="stat-failed">0</div>
            </div>
        </div>

        <div class="main-content">
            <div class="section-header">
                <h2 class="section-title">Webhooks</h2>
                <button class="btn" onclick="openCreateModal()">+ Create Webhook</button>
            </div>

            <div id="webhook-list" class="webhook-list">
                <div class="loading">Loading webhooks</div>
            </div>
        </div>
    </div>

    <!-- Create/Edit Webhook Modal -->
    <div id="webhook-modal" class="modal">
        <div class="modal-content">
            <h2 class="modal-header" id="modal-title">Create Webhook</h2>
            <form id="webhook-form" onsubmit="submitWebhook(event)">
                <div class="form-group">
                    <label class="form-label">Webhook URL *</label>
                    <input type="url" class="form-input" id="webhook-url" placeholder="https://your-app.com/webhook" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Event Types *</label>
                    <div class="checkbox-group" id="event-types">
                        <!-- Generated dynamically -->
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Secret Key (auto-generated if empty)</label>
                    <input type="text" class="form-input" id="webhook-secret" placeholder="Leave empty for auto-generation">
                </div>

                <div class="form-group">
                    <label class="form-label">Status</label>
                    <select class="form-input" id="webhook-status">
                        <option value="active">Active</option>
                        <option value="inactive">Inactive</option>
                    </select>
                </div>

                <div class="form-actions">
                    <button type="button" class="btn btn-sm" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn btn-sm btn-success">Save Webhook</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Delivery Log Modal -->
    <div id="delivery-modal" class="modal">
        <div class="modal-content">
            <h2 class="modal-header">Delivery Log</h2>
            <div id="delivery-log" class="delivery-log">
                <div class="loading">Loading deliveries</div>
            </div>
            <div class="form-actions">
                <button type="button" class="btn btn-sm" onclick="closeDeliveryModal()">Close</button>
            </div>
        </div>
    </div>

    <!-- Test Webhook Modal -->
    <div id="test-modal" class="modal">
        <div class="modal-content">
            <h2 class="modal-header">Test Webhook</h2>
            <form id="test-form" onsubmit="sendTestWebhook(event)">
                <div class="form-group">
                    <label class="form-label">Event Type</label>
                    <select class="form-input" id="test-event-type">
                        <option value="system.info">system.info</option>
                        <option value="conversation.started">conversation.started</option>
                        <option value="message.sent">message.sent</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">Test Data (JSON)</label>
                    <textarea class="form-input" id="test-data" rows="8">{"test": true, "message": "This is a test webhook"}</textarea>
                </div>

                <div id="test-result" style="margin-top: 20px;"></div>

                <div class="form-actions">
                    <button type="button" class="btn btn-sm" onclick="closeTestModal()">Close</button>
                    <button type="submit" class="btn btn-sm btn-success">Send Test</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:7071/api'; // Change to your Azure Function URL

        let currentWebhookId = null;
        let testWebhookId = null;

        const EVENT_TYPES = [
            'ambassador.created', 'ambassador.updated', 'ambassador.deleted',
            'conversation.started', 'conversation.ended', 'conversation.resumed',
            'message.sent', 'message.received', 'message.edited', 'message.deleted',
            'qr.scanned', 'qr.generated',
            'user.created', 'user.updated', 'user.banned', 'user.unbanned',
            'moderation.flagged', 'moderation.approved', 'moderation.rejected',
            'analytics.milestone', 'analytics.report',
            'system.error', 'system.warning', 'system.info'
        ];

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            loadWebhooks();
            loadStats();
            renderEventTypes();

            // Auto-refresh every 30 seconds
            setInterval(() => {
                loadWebhooks();
                loadStats();
            }, 30000);
        });

        function renderEventTypes() {
            const container = document.getElementById('event-types');
            container.innerHTML = EVENT_TYPES.map(type => `
                <div class="checkbox-item">
                    <input type="checkbox" id="event-${type}" value="${type}">
                    <label for="event-${type}">${type}</label>
                </div>
            `).join('');
        }

        async function loadWebhooks() {
            try {
                const response = await fetch(`${API_BASE}/webhooks`);
                const data = await response.json();

                renderWebhooks(data.webhooks || []);
            } catch (error) {
                console.error('Error loading webhooks:', error);
                document.getElementById('webhook-list').innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">⚠️</div>
                        <p>Error loading webhooks</p>
                    </div>
                `;
            }
        }

        async function loadStats() {
            try {
                const response = await fetch(`${API_BASE}/webhooks/stats`);
                const data = await response.json();
                const stats = data.stats || {};

                document.getElementById('stat-active').textContent = stats.active_webhooks || 0;
                document.getElementById('stat-events').textContent = stats.total_deliveries || 0;
                document.getElementById('stat-success').textContent = (stats.success_rate || 0).toFixed(1);
                document.getElementById('stat-failed').textContent = stats.failed_deliveries || 0;
            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }

        function renderWebhooks(webhooks) {
            const container = document.getElementById('webhook-list');

            if (webhooks.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">🎣</div>
                        <p>No webhooks configured yet</p>
                        <button class="btn btn-sm" onclick="openCreateModal()" style="margin-top: 20px;">Create Your First Webhook</button>
                    </div>
                `;
                return;
            }

            container.innerHTML = webhooks.map(webhook => `
                <div class="webhook-item">
                    <div class="webhook-header">
                        <div class="webhook-url">${webhook.url}</div>
                        <span class="badge badge-${webhook.status}">${webhook.status.toUpperCase()}</span>
                    </div>

                    <div class="webhook-meta">
                        <div class="meta-item">
                            <span class="meta-label">ID:</span> ${webhook.webhook_id.substring(0, 8)}...
                        </div>
                        <div class="meta-item">
                            <span class="meta-label">Created:</span> ${new Date(webhook.created_at).toLocaleDateString()}
                        </div>
                    </div>

                    <div style="margin-bottom: 15px;">
                        <span class="meta-label">Events:</span>
                        ${webhook.event_types.map(type => `<span class="badge badge-event">${type}</span>`).join('')}
                    </div>

                    <div class="webhook-actions">
                        <button class="btn btn-sm btn-success" onclick="testWebhook('${webhook.webhook_id}')">Test</button>
                        <button class="btn btn-sm" onclick="viewDeliveries('${webhook.webhook_id}')">View Logs</button>
                        <button class="btn btn-sm" onclick="editWebhook('${webhook.webhook_id}')">Edit</button>
                        <button class="btn btn-sm btn-danger" onclick="deleteWebhook('${webhook.webhook_id}')">Delete</button>
                    </div>
                </div>
            `).join('');
        }

        function openCreateModal() {
            currentWebhookId = null;
            document.getElementById('modal-title').textContent = 'Create Webhook';
            document.getElementById('webhook-form').reset();
            document.getElementById('webhook-modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('webhook-modal').classList.remove('active');
        }

        async function submitWebhook(event) {
            event.preventDefault();

            const url = document.getElementById('webhook-url').value;
            const secret = document.getElementById('webhook-secret').value;
            const status = document.getElementById('webhook-status').value;

            const eventTypes = Array.from(document.querySelectorAll('#event-types input:checked'))
                .map(cb => cb.value);

            if (eventTypes.length === 0) {
                alert('Please select at least one event type');
                return;
            }

            const data = {
                url,
                event_types: eventTypes,
                status
            };

            if (secret) {
                data.secret_key = secret;
            }

            try {
                const response = await fetch(`${API_BASE}/webhooks`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (response.ok) {
                    closeModal();
                    loadWebhooks();
                    loadStats();
                } else {
                    const error = await response.json();
                    alert('Error: ' + (error.error || 'Failed to create webhook'));
                }
            } catch (error) {
                console.error('Error creating webhook:', error);
                alert('Error creating webhook');
            }
        }

        async function deleteWebhook(webhookId) {
            if (!confirm('Are you sure you want to delete this webhook?')) {
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/webhooks/${webhookId}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    loadWebhooks();
                    loadStats();
                } else {
                    alert('Error deleting webhook');
                }
            } catch (error) {
                console.error('Error deleting webhook:', error);
                alert('Error deleting webhook');
            }
        }

        function testWebhook(webhookId) {
            testWebhookId = webhookId;
            document.getElementById('test-modal').classList.add('active');
            document.getElementById('test-result').innerHTML = '';
        }

        function closeTestModal() {
            document.getElementById('test-modal').classList.remove('active');
        }

        async function sendTestWebhook(event) {
            event.preventDefault();

            const eventType = document.getElementById('test-event-type').value;
            const dataText = document.getElementById('test-data').value;

            let testData;
            try {
                testData = JSON.parse(dataText);
            } catch (e) {
                alert('Invalid JSON in test data');
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/webhooks/${testWebhookId}/test`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        event_type: eventType,
                        data: testData
                    })
                });

                const result = await response.json();

                const resultDiv = document.getElementById('test-result');
                const success = result.status === 'success';

                resultDiv.innerHTML = `
                    <div class="delivery-item ${success ? 'success' : 'failed'}">
                        <div class="delivery-header">
                            <strong>Status: ${result.status}</strong>
                            <span>${result.duration_ms}ms</span>
                        </div>
                        <div class="delivery-details">
                            Response Code: ${result.response_code || 'N/A'}<br>
                            ${result.error_message ? `Error: ${result.error_message}` : 'Success!'}
                        </div>
                        ${result.response_body ? `<div class="code-block">${result.response_body}</div>` : ''}
                    </div>
                `;
            } catch (error) {
                console.error('Error testing webhook:', error);
                alert('Error testing webhook');
            }
        }

        async function viewDeliveries(webhookId) {
            document.getElementById('delivery-modal').classList.add('active');
            document.getElementById('delivery-log').innerHTML = '<div class="loading">Loading deliveries</div>';

            try {
                const response = await fetch(`${API_BASE}/webhooks/${webhookId}/deliveries?limit=50`);
                const data = await response.json();

                renderDeliveries(data.deliveries || []);
            } catch (error) {
                console.error('Error loading deliveries:', error);
                document.getElementById('delivery-log').innerHTML = `
                    <div class="empty-state">
                        <p>Error loading deliveries</p>
                    </div>
                `;
            }
        }

        function closeDeliveryModal() {
            document.getElementById('delivery-modal').classList.remove('active');
        }

        function renderDeliveries(deliveries) {
            const container = document.getElementById('delivery-log');

            if (deliveries.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📋</div>
                        <p>No deliveries yet</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = deliveries.map(delivery => {
                const event = delivery.event || {};
                const success = delivery.status === 'success';

                return `
                    <div class="delivery-item ${success ? 'success' : 'failed'}">
                        <div class="delivery-header">
                            <strong>${event.event_type || 'Unknown Event'}</strong>
                            <span class="delivery-time">${new Date(delivery.timestamp).toLocaleString()}</span>
                        </div>
                        <div class="delivery-details">
                            Attempt #${delivery.attempt_number + 1} |
                            Status: ${delivery.status} |
                            ${delivery.response_code ? `HTTP ${delivery.response_code}` : 'No response'} |
                            ${delivery.duration_ms ? `${delivery.duration_ms.toFixed(0)}ms` : ''}
                            ${delivery.error_message ? `<br>Error: ${delivery.error_message}` : ''}
                        </div>
                        ${delivery.response_body ? `<div class="code-block">${delivery.response_body.substring(0, 200)}...</div>` : ''}
                    </div>
                `;
            }).join('');
        }
    </script>
</body>
</html>
