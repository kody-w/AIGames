<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#6366f1">
  <title>Offline - AI Ambassadors</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      text-align: center;
    }

    .offline-container {
      max-width: 400px;
    }

    .offline-icon {
      font-size: 80px;
      margin-bottom: 24px;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-10px);
      }
    }

    h1 {
      font-size: 28px;
      margin-bottom: 16px;
      font-weight: 600;
    }

    p {
      font-size: 16px;
      line-height: 1.6;
      opacity: 0.9;
      margin-bottom: 32px;
    }

    .offline-actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .button {
      background: white;
      color: #667eea;
      border: none;
      padding: 16px 32px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      text-decoration: none;
      display: inline-block;
    }

    .button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
    }

    .button:active {
      transform: translateY(0);
    }

    .button.secondary {
      background: transparent;
      border: 2px solid white;
      color: white;
    }

    .status {
      margin-top: 32px;
      font-size: 14px;
      opacity: 0.8;
    }

    .status-indicator {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef4444;
      margin-right: 8px;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 1;
      }
      50% {
        opacity: 0.5;
      }
    }

    .cached-info {
      margin-top: 24px;
      padding: 16px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      font-size: 14px;
    }

    .cached-info strong {
      display: block;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <div class="offline-container">
    <div class="offline-icon">📡</div>

    <h1>You're Offline</h1>

    <p>
      It looks like you've lost your internet connection. Don't worry - your AI Ambassadors
      are still here, and your messages will be sent when you reconnect.
    </p>

    <div class="offline-actions">
      <button class="button" onclick="window.location.reload()">
        Try Again
      </button>

      <a href="/" class="button secondary">
        Go to Home
      </a>
    </div>

    <div class="status">
      <span class="status-indicator"></span>
      <span id="statusText">Checking connection...</span>
    </div>

    <div class="cached-info" id="cachedInfo" style="display: none;">
      <strong>Cached Content Available</strong>
      <p id="cachedDetails">You can view your previous conversations offline.</p>
    </div>
  </div>

  <script>
    // Check online status
    function updateStatus() {
      const statusText = document.getElementById('statusText');
      const statusIndicator = document.querySelector('.status-indicator');

      if (navigator.onLine) {
        statusText.textContent = 'Connection restored! Redirecting...';
        statusIndicator.style.background = '#10b981';
        setTimeout(() => {
          window.location.href = document.referrer || '/';
        }, 1000);
      } else {
        statusText.textContent = 'No internet connection';
        statusIndicator.style.background = '#ef4444';
      }
    }

    // Check for cached content
    async function checkCachedContent() {
      try {
        const db = await openDatabase();
        const tx = db.transaction('conversations', 'readonly');
        const store = tx.objectStore('conversations');
        const count = await store.count();

        if (count.result > 0) {
          document.getElementById('cachedInfo').style.display = 'block';
          document.getElementById('cachedDetails').textContent =
            `You have ${count.result} cached message(s) available offline.`;
        }
      } catch (error) {
        console.error('Failed to check cached content:', error);
      }
    }

    function openDatabase() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open('AIAmbassadorDB', 1);
        request.onerror = () => reject(request.error);
        request.onsuccess = () => resolve(request.result);
      });
    }

    // Listen for online event
    window.addEventListener('online', updateStatus);
    window.addEventListener('offline', updateStatus);

    // Initial status check
    updateStatus();
    checkCachedContent();

    // Periodic connection check
    setInterval(updateStatus, 5000);
  </script>
</body>
</html>
