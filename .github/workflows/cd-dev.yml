name: Deploy to Development

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

env:
  ENVIRONMENT: dev
  AZURE_REGION: eastus
  PYTHON_VERSION: '3.11'

jobs:
  deploy-infrastructure:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    environment: dev
    outputs:
      function-app-name: ${{ steps.deploy.outputs.functionAppName }}
      resource-group: ${{ steps.deploy.outputs.resourceGroupName }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Install Bicep
        run: |
          az bicep install
          az bicep upgrade

      - name: Deploy infrastructure
        id: deploy
        run: |
          DEPLOYMENT_NAME="dev-deployment-$(date +%Y%m%d-%H%M%S)"

          az deployment sub create \
            --name "$DEPLOYMENT_NAME" \
            --location ${{ env.AZURE_REGION }} \
            --template-file infrastructure/bicep/main.bicep \
            --parameters infrastructure/bicep/parameters/dev.bicepparam \
            --output json > deployment-output.json

          # Extract outputs
          FUNC_APP_NAME=$(jq -r '.properties.outputs.functionAppName.value' deployment-output.json)
          RG_NAME=$(jq -r '.properties.outputs.resourceGroupName.value' deployment-output.json)

          echo "functionAppName=$FUNC_APP_NAME" >> $GITHUB_OUTPUT
          echo "resourceGroupName=$RG_NAME" >> $GITHUB_OUTPUT

      - name: Upload deployment outputs
        uses: actions/upload-artifact@v4
        with:
          name: deployment-outputs
          path: deployment-output.json

  deploy-application:
    name: Deploy Application
    runs-on: ubuntu-latest
    needs: deploy-infrastructure
    environment: dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          cd Copilot-Agent-365-main
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Function App
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ needs.deploy-infrastructure.outputs.function-app-name }}
          package: Copilot-Agent-365-main
          scm-do-build-during-deployment: true
          enable-oryx-build: true

  upload-agents:
    name: Upload Agent Files
    runs-on: ubuntu-latest
    needs: [deploy-infrastructure, deploy-application]
    environment: dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Upload agents to storage
        run: |
          RG_NAME="${{ needs.deploy-infrastructure.outputs.resource-group }}"

          # Get storage account name
          STORAGE_ACCOUNT=$(az storage account list \
            --resource-group "$RG_NAME" \
            --query "[0].name" -o tsv)

          # Get storage connection string
          CONN_STRING=$(az storage account show-connection-string \
            --name "$STORAGE_ACCOUNT" \
            --resource-group "$RG_NAME" \
            --query connectionString -o tsv)

          # Upload agent files
          cd Copilot-Agent-365-main/agents
          for agent in *.py; do
            echo "Uploading $agent..."
            az storage file upload \
              --share-name agents \
              --source "$agent" \
              --connection-string "$CONN_STRING"
          done

  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: [deploy-infrastructure, deploy-application, upload-agents]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download deployment outputs
        uses: actions/download-artifact@v4
        with:
          name: deployment-outputs

      - name: Run smoke tests
        run: |
          FUNC_APP_HOSTNAME=$(jq -r '.properties.outputs.functionAppHostname.value' deployment-output.json)

          # Test health endpoint
          echo "Testing health endpoint..."
          curl -f "https://${FUNC_APP_HOSTNAME}/api/health" || echo "Health endpoint not available (may need function code)"

          # Test main function
          echo "Testing main function..."
          curl -X POST "https://${FUNC_APP_HOSTNAME}/api/businessinsightbot_function" \
            -H "Content-Type: application/json" \
            -d '{"user_input": "Hello", "conversation_history": []}' \
            || echo "Function may not be ready yet"

      - name: Smoke tests completed
        run: echo "Smoke tests completed for dev environment"

  notify-success:
    name: Notify Deployment Success
    runs-on: ubuntu-latest
    needs: [smoke-tests]
    if: success()

    steps:
      - name: Download deployment outputs
        uses: actions/download-artifact@v4
        with:
          name: deployment-outputs

      - name: Send success notification
        run: |
          FUNC_APP_URL="https://$(jq -r '.properties.outputs.functionAppHostname.value' deployment-output.json)"
          echo "Deployment to dev environment successful!"
          echo "Function App URL: $FUNC_APP_URL"
          # Add Slack/Teams notification here

  notify-failure:
    name: Notify Deployment Failure
    runs-on: ubuntu-latest
    needs: [deploy-infrastructure, deploy-application, upload-agents, smoke-tests]
    if: failure()

    steps:
      - name: Send failure notification
        run: |
          echo "Deployment to dev environment failed!"
          # Add Slack/Teams notification here
