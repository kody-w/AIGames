name: AI Ambassador Platform - Testing

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11']
      fail-fast: false

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        cd Copilot-Agent-365-main
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov pytest-mock pytest-asyncio

    - name: Run unit tests
      run: |
        cd Copilot-Agent-365-main
        pytest tests/unit/ -v --cov=. --cov-report=xml --cov-report=term-missing -m unit
      continue-on-error: false

    - name: Run integration tests
      run: |
        cd Copilot-Agent-365-main
        pytest tests/integration/ -v --cov=. --cov-append --cov-report=xml --cov-report=term-missing -m integration
      continue-on-error: false

    - name: Run E2E tests
      run: |
        cd Copilot-Agent-365-main
        pytest tests/e2e/ -v --cov=. --cov-append --cov-report=xml --cov-report=term-missing -m e2e
      continue-on-error: false

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./Copilot-Agent-365-main/coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    - name: Generate coverage report
      run: |
        cd Copilot-Agent-365-main
        pytest --cov=. --cov-report=html --cov-report=term

    - name: Upload coverage HTML
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: Copilot-Agent-365-main/htmlcov/

    - name: Comment PR with coverage
      if: github.event_name == 'pull_request'
      uses: py-cov-action/python-coverage-comment-action@v3
      with:
        GITHUB_TOKEN: ${{ github.token }}
        MINIMUM_GREEN: 80
        MINIMUM_ORANGE: 70

  lint:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pylint black isort

    - name: Run flake8
      run: |
        cd Copilot-Agent-365-main
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      continue-on-error: true

    - name: Check code formatting with black
      run: |
        cd Copilot-Agent-365-main
        black --check --diff .
      continue-on-error: true

    - name: Check import ordering with isort
      run: |
        cd Copilot-Agent-365-main
        isort --check-only --diff .
      continue-on-error: true

  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install security tools
      run: |
        python -m pip install --upgrade pip
        pip install safety bandit

    - name: Run safety check on dependencies
      run: |
        cd Copilot-Agent-365-main
        safety check --file requirements.txt
      continue-on-error: true

    - name: Run bandit security scan
      run: |
        cd Copilot-Agent-365-main
        bandit -r . -f json -o bandit-report.json
      continue-on-error: true

    - name: Upload bandit report
      uses: actions/upload-artifact@v4
      with:
        name: bandit-security-report
        path: Copilot-Agent-365-main/bandit-report.json
      if: always()

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [test, lint, security]
    if: always()

    steps:
    - name: Check test results
      run: |
        echo "Test job status: ${{ needs.test.result }}"
        echo "Lint job status: ${{ needs.lint.result }}"
        echo "Security job status: ${{ needs.security.result }}"

    - name: Report status
      run: |
        if [ "${{ needs.test.result }}" != "success" ]; then
          echo "Tests failed! Please review the test output."
          exit 1
        fi
        echo "All tests passed successfully!"
