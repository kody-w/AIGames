name: Deploy to Staging

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  ENVIRONMENT: staging
  AZURE_REGION: eastus
  PYTHON_VERSION: '3.11'

jobs:
  deploy-infrastructure:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    environment: staging
    outputs:
      function-app-name: ${{ steps.deploy.outputs.functionAppName }}
      resource-group: ${{ steps.deploy.outputs.resourceGroupName }}
      slot-name: ${{ steps.deploy.outputs.slotName }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Create pre-deployment backup
        run: |
          RG_NAME="aibast-staging-rg"

          if az group exists --name "$RG_NAME" | grep -q "true"; then
            echo "Creating backup..."
            BACKUP_NAME="backup-$(date +%Y%m%d-%H%M%S)"
            mkdir -p backups

            az group export \
              --name "$RG_NAME" \
              --output json > "backups/$BACKUP_NAME.json"

            echo "Backup created: backups/$BACKUP_NAME.json"
          fi

      - name: Deploy infrastructure
        id: deploy
        run: |
          DEPLOYMENT_NAME="staging-deployment-$(date +%Y%m%d-%H%M%S)"

          az deployment sub create \
            --name "$DEPLOYMENT_NAME" \
            --location ${{ env.AZURE_REGION }} \
            --template-file infrastructure/bicep/main.bicep \
            --parameters infrastructure/bicep/parameters/staging.bicepparam \
            --output json > deployment-output.json

          # Extract outputs
          FUNC_APP_NAME=$(jq -r '.properties.outputs.functionAppName.value' deployment-output.json)
          RG_NAME=$(jq -r '.properties.outputs.resourceGroupName.value' deployment-output.json)
          SLOT_NAME=$(jq -r '.properties.outputs.slotName.value' deployment-output.json)

          echo "functionAppName=$FUNC_APP_NAME" >> $GITHUB_OUTPUT
          echo "resourceGroupName=$RG_NAME" >> $GITHUB_OUTPUT
          echo "slotName=$SLOT_NAME" >> $GITHUB_OUTPUT

      - name: Upload deployment outputs
        uses: actions/upload-artifact@v4
        with:
          name: deployment-outputs
          path: deployment-output.json

  deploy-to-slot:
    name: Deploy to Staging Slot
    runs-on: ubuntu-latest
    needs: deploy-infrastructure
    environment: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          cd Copilot-Agent-365-main
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to staging slot
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ needs.deploy-infrastructure.outputs.function-app-name }}
          slot-name: staging
          package: Copilot-Agent-365-main
          scm-do-build-during-deployment: true
          enable-oryx-build: true

  integration-tests:
    name: Integration Tests (Staging Slot)
    runs-on: ubuntu-latest
    needs: [deploy-infrastructure, deploy-to-slot]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download deployment outputs
        uses: actions/download-artifact@v4
        with:
          name: deployment-outputs

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get staging slot URL
        id: slot-url
        run: |
          FUNC_APP_NAME="${{ needs.deploy-infrastructure.outputs.function-app-name }}"
          RG_NAME="${{ needs.deploy-infrastructure.outputs.resource-group }}"

          SLOT_HOSTNAME=$(az functionapp show \
            --name "$FUNC_APP_NAME" \
            --resource-group "$RG_NAME" \
            --slot staging \
            --query "defaultHostName" -o tsv)

          echo "slotHostname=$SLOT_HOSTNAME" >> $GITHUB_OUTPUT

      - name: Run integration tests
        run: |
          SLOT_URL="https://${{ steps.slot-url.outputs.slotHostname }}"

          # Test health endpoint
          echo "Testing health endpoint on staging slot..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$SLOT_URL/api/health")
          echo "Health check returned: $HTTP_CODE"

          # Test main function
          echo "Testing main function on staging slot..."
          curl -X POST "$SLOT_URL/api/businessinsightbot_function" \
            -H "Content-Type: application/json" \
            -d '{"user_input": "Test deployment", "conversation_history": []}'

          echo "Integration tests completed"

  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    needs: [deploy-infrastructure, deploy-to-slot, integration-tests]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run load tests
        run: |
          echo "Running performance tests..."
          # Add load testing logic here (e.g., Apache JMeter, K6, Artillery)

  swap-slots:
    name: Swap Staging to Production
    runs-on: ubuntu-latest
    needs: [integration-tests, performance-tests]
    environment: staging-approval

    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Swap slots
        run: |
          FUNC_APP_NAME="${{ needs.deploy-infrastructure.outputs.function-app-name }}"
          RG_NAME="${{ needs.deploy-infrastructure.outputs.resource-group }}"

          echo "Swapping staging slot to production..."

          az functionapp deployment slot swap \
            --name "$FUNC_APP_NAME" \
            --resource-group "$RG_NAME" \
            --slot staging \
            --target-slot production

          echo "Slot swap completed!"

  post-deployment-tests:
    name: Post-Deployment Tests
    runs-on: ubuntu-latest
    needs: [deploy-infrastructure, swap-slots]

    steps:
      - name: Download deployment outputs
        uses: actions/download-artifact@v4
        with:
          name: deployment-outputs

      - name: Run smoke tests on production
        run: |
          FUNC_APP_HOSTNAME=$(jq -r '.properties.outputs.functionAppHostname.value' deployment-output.json)

          # Test production endpoint
          echo "Testing production endpoint..."
          curl -f "https://${FUNC_APP_HOSTNAME}/api/health"

          echo "Production smoke tests completed"

  rollback-on-failure:
    name: Rollback on Failure
    runs-on: ubuntu-latest
    needs: [swap-slots, post-deployment-tests]
    if: failure()

    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Rollback - Swap back to previous version
        run: |
          FUNC_APP_NAME="${{ needs.deploy-infrastructure.outputs.function-app-name }}"
          RG_NAME="${{ needs.deploy-infrastructure.outputs.resource-group }}"

          echo "Rolling back deployment..."

          az functionapp deployment slot swap \
            --name "$FUNC_APP_NAME" \
            --resource-group "$RG_NAME" \
            --slot staging \
            --target-slot production

          echo "Rollback completed!"

      - name: Notify rollback
        run: |
          echo "Deployment rolled back due to post-deployment test failures"
          # Add notification logic

  notify-success:
    name: Notify Success
    runs-on: ubuntu-latest
    needs: [post-deployment-tests]
    if: success()

    steps:
      - name: Send success notification
        run: |
          echo "Deployment to staging environment successful!"
          # Add Slack/Teams notification

  notify-failure:
    name: Notify Failure
    runs-on: ubuntu-latest
    needs: [deploy-infrastructure, deploy-to-slot, integration-tests, swap-slots]
    if: failure()

    steps:
      - name: Send failure notification
        run: |
          echo "Deployment to staging environment failed!"
          # Add Slack/Teams notification
